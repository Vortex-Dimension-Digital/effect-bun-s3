name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a breaking Bun or Effect release shows up before users hit it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run knip
      - run: bun run validate:package

  test:
    name: Test (Bun ${{ matrix.bun }}, Effect ${{ matrix.effect }})
    runs-on: ubuntu-latest
    # Canary is a preview of the next Bun: report it, never block on it.
    continue-on-error: ${{ matrix.bun == 'canary' }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported versions and the newest releases.
        bun: ["1.4.4", "latest"]
        effect: ["4.1.0", "latest"]
        include:
          - bun: canary
            effect: latest
    services:
      s3:
        image: rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: effect-bun-s3
          RUSTFS_SECRET_KEY: effect-bun-s3-secret
        ports:
          - 9100:9000
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9100
      S3_TEST_BUCKET: effect-bun-s3-test
      S3_TEST_ACCESS_KEY_ID: effect-bun-s3
      S3_TEST_SECRET_ACCESS_KEY: effect-bun-s3-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: Use Effect ${{ matrix.effect }}
        run: bun add --dev --exact effect@${{ matrix.effect }}
      # Bun's S3 client cannot create buckets; the runner's AWS CLI can.
      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_TEST_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_TEST_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for attempt in $(seq 30); do
            aws --endpoint-url "$S3_TEST_ENDPOINT" s3 ls >/dev/null 2>&1 && break
            sleep 1
          done
          aws --endpoint-url "$S3_TEST_ENDPOINT" s3 mb "s3://$S3_TEST_BUCKET"
      - run: bun run check
      - run: bun test
